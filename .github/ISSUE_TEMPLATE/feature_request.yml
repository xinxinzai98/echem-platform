name: Feature request
description: Propose a bounded improvement to the local read-only workbench.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What research-data workflow problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe observable behavior without assuming instrument-control access.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: boundary
    attributes:
      label: Safety-boundary impact
      options:
        - No change to read-only, loopback-only, no-serial, and no-instrument-control boundaries
        - Unsure; maintainer threat-model review is needed
        - This would change a boundary and should not be implemented in the public baseline
    validations:
      required: true
  - type: checkboxes
    id: data
    attributes:
      label: Data confirmation
      options:
        - label: This request contains no real experimental data, credential, private identifier, or vendor-proprietary material.
          required: true
